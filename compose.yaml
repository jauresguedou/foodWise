# Local Postgres for integration tests (and offline development).
# Start with `npm run db:test:up`. Port 5433 avoids clashing with a local install.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: foodwise
      POSTGRES_PASSWORD: foodwise
      POSTGRES_DB: foodwise_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U foodwise -d foodwise_test']
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
